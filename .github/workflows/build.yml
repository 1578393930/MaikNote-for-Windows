name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '1578393930/MaikNote-for-Windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64
      - name: Check source upload policy
        run: node scripts/check-upload-files.mjs
      - run: npm ci
      - name: Validate release version and repository
        id: release-version
        shell: pwsh
        run: |
          node scripts/check-release.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content version.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ('${{ github.ref_type }}' -eq 'tag') {
            if ('${{ github.ref_name }}' -cne "v$version") { throw 'Tag must equal v + version.json version' }
          }
      - run: npm test
      - run: node --test scripts/verify-updater-signature.test.mjs
      - name: Build signed Windows installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/tauri-build-signed.ps1 "$pwd"
      - name: Prepare and verify release assets
        run: node scripts/make-latest-json.mjs
      - name: Build portable archive
        shell: pwsh
        run: ./scripts/make-portable.ps1 -Root "$pwd"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release-portable/MaikNote_${{ steps.release-version.outputs.version }}_x64-setup.exe
            release-portable/MaikNote_${{ steps.release-version.outputs.version }}_x64-setup.exe.sig
            release-portable/MaikNote_${{ steps.release-version.outputs.version }}_x64-portable.zip
            release-portable/latest.json
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "release-assets/MaikNote_${version}_x64-setup.exe"
            "release-assets/MaikNote_${version}_x64-setup.exe.sig"
            "release-assets/MaikNote_${version}_x64-portable.zip"
            "release-assets/latest.json"
          )
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && -s "$asset" && ! -L "$asset" ]] || { echo "Missing or invalid release asset: $asset"; exit 1; }
          done
          shopt -s nullglob dotglob
          entries=(release-assets/*)
          [[ ${#entries[@]} -eq 4 ]] || { echo 'Unexpected release files: only the four current-version assets are allowed'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json')).isDraft) throw Error('Refusing to overwrite a published release')"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
