[package]
name = "maiknote"
version = "0.10.22"
description = "A macOS Markdown note-taking app"
authors = ["sansui"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maiknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
# WebDAV 同步：multistatus 解析 / HTTP 日期 / URL 解析 / 冲突副本 id
regex = "1"
httpdate = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"
window-vibrancy = "0.5"
# 跨平台回收站（Windows 走系统回收站）
trash = "5"
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.5"
libc = "0.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
